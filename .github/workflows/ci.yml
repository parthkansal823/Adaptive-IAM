name: Research prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/check.py --all
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/verify_research.py
      - name: Generate reproducible measured comparison
        run: python experiments/evaluate.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation
          path: experiments/results.json
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

