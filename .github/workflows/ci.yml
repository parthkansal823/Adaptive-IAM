name: Research prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python scripts/check.py --all
      - run: python scripts/run_tests.py -s backend/tests
      - run: python scripts/run_tests.py -s scripts/tests
      - run: python scripts/run_tests.py -s experiments/tests
      - run: python scripts/run_tests.py -s integrations/python/tests
      - run: python scripts/verify_research.py
      - name: Generate reproducible measured comparison
        run: python experiments/evaluate.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation
          path: experiments/results.json
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Console browser regressions against isolated API fixtures
        run: node frontend/tests/console-regression.mjs
  website-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/node/package-lock.json
      - run: npm --prefix integrations/node ci
      - run: npm --prefix integrations/node test
  local-evm-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm --prefix blockchain ci
      - run: npm --prefix blockchain test
  live-api-evm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm --prefix blockchain ci
      - name: API owner/quorum, checkpoint, expiry, revocation and outage checks
        run: node blockchain/scripts/verify-api.mjs
