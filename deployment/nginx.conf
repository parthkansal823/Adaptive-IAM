server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:8000; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_read_timeout 15s; }
    location /oauth/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_read_timeout 15s; }
    location /.well-known/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
